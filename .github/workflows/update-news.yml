name: Update News Feed (Stable)

on:
  schedule:
    - cron: '0 */6 * * *'  # 6時間ごと
  workflow_dispatch:  # 手動実行可能

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # タイムアウト設定
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --no-cache-dir \
            feedparser \
            python-dateutil \
            requests
      
      # ロックファイル取得試行（競合防止）
      - name: Acquire lock
        id: lock
        run: |
          MAX_WAIT=300  # 最大5分待機
          WAITED=0
          
          while [ -f .update.lock ]; do
            echo "⏳ Lock file exists, waiting..."
            sleep 10
            WAITED=$((WAITED + 10))
            
            if [ $WAITED -ge $MAX_WAIT ]; then
              echo "❌ Lock timeout after ${MAX_WAIT}s"
              exit 1
            fi
          done
          
          # ロック取得
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .update.lock
          echo "✅ Lock acquired"
      
      - name: Fetch RSS feeds
        run: python scripts/fetch_rss.py
      
      - name: Generate archives
        run: python scripts/gen_archive.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 変更があれば commit
          if git diff --quiet data/; then
            echo "ℹ️ No changes to commit"
          else
            git add data/
            git commit -m "chore: update news data [$(date -u +%Y-%m-%d\ %H:%M:%S)]"
            
            # push（リトライ付き）
            for i in {1..3}; do
              if git push; then
                echo "✅ Push succeeded on attempt $i"
                break
              else
                echo "⚠️ Push failed, retrying ($i/3)..."
                git pull --rebase
                sleep 5
              fi
            done
          fi
      
      # ロック解放（必ず実行）
      - name: Release lock
        if: always()
        run: |
          if [ -f .update.lock ]; then
            rm .update.lock
            echo "🔓 Lock released"
          fi
