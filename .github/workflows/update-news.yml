name: Update News Feed (Stable)

on:
  schedule:
    - cron: '0 */6 * * *'  # 6時間ごと
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install --no-cache-dir \
          feedparser==6.0.10 \
          python-dateutil==2.8.2 \
          requests==2.31.0 \
          urllib3==2.1.0 \
          deep-translator==1.11.4
    
    - name: Acquire lock
      run: |
        if [ -f .update-lock ]; then
          echo "Update already running"
          exit 1
        fi
        touch .update-lock
    
    - name: Fetch RSS
      run: |
        python scripts/fetch_rss.py
    
    - name: Release lock
      if: always()
      run: rm -f .update-lock
    
    - name: Commit and push
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add data/
        git diff --quiet && git diff --staged --quiet || (
          git commit -m "data: RSS更新 $(date -u +'%Y-%m-%d %H:%M UTC')" &&
          for i in {1..3}; do
            git push && break || sleep 5
          done
        )
