<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SE/NEWS - セキュリティニュースターミナル</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #0a0e1a;
      color: #00ff41;
      padding: 20px;
      line-height: 1.6;
    }
    
    .header {
      border: 2px solid #00ff41;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      text-transform: uppercase;
    }
    
    .nav {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .nav-btn {
      background: transparent;
      color: #00ff41;
      border: 1px solid #00ff41;
      padding: 8px 16px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    
    .nav-btn:hover,
    .nav-btn.active {
      background: #00ff41;
      color: #0a0e1a;
    }
    
    .feed-status {
      padding: 10px;
      margin-bottom: 20px;
      border-left: 3px solid #00ff41;
      font-size: 14px;
    }
    
    /* 仮想スクロールコンテナ */
    .virtual-scroll-container {
      height: calc(100vh - 300px);
      overflow-y: auto;
      position: relative;
    }
    
    .virtual-scroll-spacer {
      height: 0;
    }
    
    .virtual-items {
      position: relative;
    }
    
    .item {
      border: 1px solid #00ff41;
      padding: 15px;
      margin-bottom: 10px;
      opacity: 0;
      animation: fadeIn 0.3s forwards;
    }
    
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    
    .item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .item-title {
      font-size: 16px;
      margin-bottom: 8px;
      color: #00ff41;
      text-decoration: none;
      display: block;
    }
    
    .item-title:hover {
      text-decoration: underline;
    }
    
    .severity {
      padding: 2px 8px;
      font-size: 11px;
      font-weight: bold;
    }
    
    .severity.critical { background: #ff0000; color: #fff; }
    .severity.high { background: #ff6600; color: #fff; }
    .severity.medium { background: #ffaa00; color: #000; }
    .severity.low { background: #00aa00; color: #fff; }
    
    .loading {
      text-align: center;
      padding: 20px;
      font-size: 18px;
    }
    
    .error {
      border: 2px solid #ff0000;
      color: #ff0000;
      padding: 20px;
      margin: 20px 0;
    }
    
    /* レスポンシブ */
    @media (max-width: 768px) {
      body { padding: 10px; }
      .header { padding: 15px; }
      .item { padding: 10px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SE / NEWS</h1>
    <p>Security & Engineering News Terminal</p>
  </div>

  <nav class="nav">
    <button class="nav-btn active" data-filter="all">📰 全記事</button>
    <button class="nav-btn" data-filter="security">🔒 セキュリティ</button>
    <button class="nav-btn" data-filter="tech">💻 技術</button>
    <button class="nav-btn" data-filter="月次">📅 月次まとめ</button>
  </nav>

  <div class="feed-status" id="status">
    ⏳ Loading...
  </div>

  <!-- 仮想スクロールコンテナ -->
  <div class="virtual-scroll-container" id="scrollContainer">
    <div class="virtual-scroll-spacer" id="spacerTop"></div>
    <div class="virtual-items" id="items"></div>
    <div class="virtual-scroll-spacer" id="spacerBottom"></div>
  </div>

  <script>
    // 設定
    const ITEM_HEIGHT = 120; // 1アイテムの平均高さ（px）
    const BUFFER_SIZE = 5;   // 上下の余分レンダリング数
    
    let allItems = [];
    let filteredItems = [];
    let currentFilter = 'all';
    
    // 仮想スクロール状態
    let scrollTop = 0;
    let containerHeight = 0;
    let visibleStartIndex = 0;
    let visibleEndIndex = 0;

    // データ取得
    async function fetchData() {
      try {
        const response = await fetch('./data/news.json');
        if (!response.ok) throw new Error('Failed to fetch news.json');
        
        const data = await response.json();
        allItems = data.items || [];
        
        document.getElementById('status').innerHTML = 
          `✅ 最終更新: ${new Date(data.last_updated).toLocaleString('ja-JP')} | 
           総記事数: ${allItems.length}`;
        
        applyFilter(currentFilter);
        
      } catch (error) {
        document.getElementById('items').innerHTML = 
          `<div class="error">❌ データ取得エラー: ${error.message}</div>`;
      }
    }

    // フィルタ適用
    function applyFilter(filter) {
      currentFilter = filter;
      
      if (filter === 'all') {
        filteredItems = allItems;
      } else if (filter === '月次') {
        showArchive();
        return;
      } else {
        filteredItems = allItems.filter(item => item.category === filter);
      }
      
      // 仮想スクロール初期化
      const container = document.getElementById('scrollContainer');
      containerHeight = container.clientHeight;
      scrollTop = 0;
      container.scrollTop = 0;
      
      updateVirtualScroll();
    }

    // 仮想スクロール更新
    function updateVirtualScroll() {
      const totalItems = filteredItems.length;
      const totalHeight = totalItems * ITEM_HEIGHT;
      
      // 表示範囲計算
      visibleStartIndex = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - BUFFER_SIZE);
      visibleEndIndex = Math.min(
        totalItems,
        Math.ceil((scrollTop + containerHeight) / ITEM_HEIGHT) + BUFFER_SIZE
      );
      
      // スペーサー高さ設定
      document.getElementById('spacerTop').style.height = 
        `${visibleStartIndex * ITEM_HEIGHT}px`;
      document.getElementById('spacerBottom').style.height = 
        `${(totalItems - visibleEndIndex) * ITEM_HEIGHT}px`;
      
      // 表示アイテムレンダリング
      const itemsContainer = document.getElementById('items');
      itemsContainer.innerHTML = '';
      
      for (let i = visibleStartIndex; i < visibleEndIndex; i++) {
        const item = filteredItems[i];
        if (!item) continue;
        
        const itemEl = document.createElement('div');
        itemEl.className = 'item';
        itemEl.innerHTML = `
          <div class="item-header">
            <span>📡 ${item.source}</span>
            ${item.severity ? 
              `<span class="severity ${item.severity}">${item.severity.toUpperCase()}</span>` 
              : ''}
            <span>🕒 ${new Date(item.date).toLocaleString('ja-JP')}</span>
          </div>
          <a href="${item.link}" target="_blank" class="item-title">
            ${item.title}
          </a>
          ${item.summary ? `<p style="font-size:13px; color:#888;">${item.summary}</p>` : ''}
        `;
        itemsContainer.appendChild(itemEl);
      }
    }

    // スクロールイベント（スロットリング）
    let scrollTimeout;
    document.getElementById('scrollContainer').addEventListener('scroll', (e) => {
      scrollTop = e.target.scrollTop;
      
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        updateVirtualScroll();
      }, 50);
    });

    // ナビゲーションボタン
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(btn.dataset.filter);
      });
    });

    // 月次アーカイブ表示
    async function showArchive() {
      try {
        const response = await fetch('./data/archive/index.json');
        if (!response.ok) throw new Error('Archive not found');
        
        const data = await response.json();
        const container = document.getElementById('items');
        
        container.innerHTML = '<h2 style="margin-bottom:20px;">📅 月次アーカイブ</h2>';
        
        data.months.forEach(month => {
          const monthEl = document.createElement('div');
          monthEl.className = 'item';
          monthEl.innerHTML = `
            <h3>${month.month}</h3>
            <p>総記事数: ${month.total_articles}</p>
            <a href="./data/archive/${month.file}" target="_blank" style="color:#00ff41;">
              詳細を見る →
            </a>
          `;
          container.appendChild(monthEl);
        });
        
        // スペーサーをリセット
        document.getElementById('spacerTop').style.height = '0';
        document.getElementById('spacerBottom').style.height = '0';
        
      } catch (error) {
        document.getElementById('items').innerHTML = 
          `<div class="error">❌ アーカイブ取得エラー: ${error.message}</div>`;
      }
    }

    // ウィンドウリサイズ対応
    window.addEventListener('resize', () => {
      containerHeight = document.getElementById('scrollContainer').clientHeight;
      updateVirtualScroll();
    });

    // 初期化
    fetchData();
  </script>
</body>
</html>
